<!-- Firebase（modular v10，CDN）-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  // 初始化（若尚未填入設定，仍可離線使用，只是不寫資料庫）
  let db = null;
  try {
    if (firebaseConfig && firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_")) {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    }
  } catch (e) {
    console.warn("Firebase 未啟用：", e);
  }

  // 暴露給非 module 腳本使用
  window.__saveResponse = async (payload) => {
    if (!db) {
      console.info("[本地模式] 收到回覆，但未連接 Firebase：", payload);
      return { ok: false, local: true };
    }
    try {
      const ref = await addDoc(collection(db, "responses"), {
        ...payload,
        createdAt: serverTimestamp(),
        userAgent: navigator.userAgent,
      });
      return { ok: true, id: ref.id };
    } catch (err) {
      console.error("寫入失敗：", err);
      return { ok: false, error: err.message };
    }
  };
</script>

}
[data-theme="night"] body::before { opacity: .35; }
/* ----------------------------------------------------------
   🌸 櫻花飄落（只在白天主題出現）
   ---------------------------------------------------------- */
.sakura-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 2;
  opacity: 1;
  transition: opacity 1s ease;
}
[data-theme="night"] .sakura-layer { opacity: 0; }
/* ----------------------------------------------------------
   👣 夜晚腳印（只在夜間主題出現）— 一串慢慢走過的腳印，像是有人正回家
   ---------------------------------------------------------- */
.footsteps-layer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 8%;
  height: 60px;
  pointer-events: none;
  z-index: 2;
  opacity: 0;
  transition: opacity 1.2s ease;
}
[data-theme="night"] .footsteps-layer { opacity: 1; }

.footstep {
  position: absolute;
  bottom: 0;
  width: 22px;
  height: 30px;
  opacity: 0;
  color: var(--accent-2);   /* 用副副色（鼠尾草奶油），溫暖不搶戲 */
  filter: drop-shadow(0 0 6px rgba(168,197,160,.4));
  animation: footstep-appear 22s linear infinite;
}
.footstep.right { transform: rotate(8deg); }
.footstep.left  { transform: rotate(-8deg); }

@keyframes footstep-appear {
  0%   { opacity: 0; }
  3%   { opacity: .85; }     /* 踏下：清晰浮現 */
  18%  { opacity: .55; }     /* 慢慢淡 */
  35%  { opacity: 0; }       /* 完全消失 */
  100% { opacity: 0; }       /* 等下一輪 */
}

/* 一串腳印，由左至右、左右腳交替，每一步間隔約 1.2 秒 */
.footstep:nth-child(1)  { left:  2%; animation-delay:  0s; }
.footstep:nth-child(2)  { left:  7%; animation-delay:  1.2s; }
.footstep:nth-child(3)  { left: 12%; animation-delay:  2.4s; }
.footstep:nth-child(4)  { left: 17%; animation-delay:  3.6s; }
.footstep:nth-child(5)  { left: 22%; animation-delay:  4.8s; }
.footstep:nth-child(6)  { left: 27%; animation-delay:  6.0s; }
.footstep:nth-child(7)  { left: 32%; animation-delay:  7.2s; }
.footstep:nth-child(8)  { left: 37%; animation-delay:  8.4s; }
.footstep:nth-child(9)  { left: 42%; animation-delay:  9.6s; }
.footstep:nth-child(10) { left: 47%; animation-delay: 10.8s; }
.footstep:nth-child(11) { left: 52%; animation-delay: 12.0s; }
.footstep:nth-child(12) { left: 57%; animation-delay: 13.2s; }
.footstep:nth-child(13) { left: 62%; animation-delay: 14.4s; }
.footstep:nth-child(14) { left: 67%; animation-delay: 15.6s; }
.footstep:nth-child(15) { left: 72%; animation-delay: 16.8s; }
.footstep:nth-child(16) { left: 77%; animation-delay: 18.0s; }
.footstep:nth-child(17) { left: 82%; animation-delay: 19.2s; }
.footstep:nth-child(18) { left: 87%; animation-delay: 20.4s; }

/* 微微的垂直錯落，模擬左右腳一前一後的步伐感 */
.footstep:nth-child(odd)  { bottom: 4px; }
.footstep:nth-child(even) { bottom: 14px; }
  
.sakura {
  position: absolute;
  top: -40px;
  width: 14px;
  height: 12px;
  background: linear-gradient(135deg, #FFE4E8 0%, #F7B6C0 50%, #E88FA0 100%);
  /* 花瓣形狀：一端尖、一端圓，像水滴 */
  border-radius: 100% 0 55% 50% / 55% 0 100% 50%;

  animation: sakura-fall linear infinite, sakura-sway ease-in-out infinite alternate;
  will-change: transform;
  filter: drop-shadow(0 1px 2px rgba(180,80,100,.18));
}
/* 花瓣末端的小凹口（那個櫻花特徵） */
.sakura::after {
  content: "";

  top: -1px;
  right: 0;
  width: 5px;
  height: 5px;
  background: var(--bg);
  border-radius: 50%;
}

@keyframes sakura-fall {
  0%   { transform: translateY(-40px) rotate(0deg) rotateY(0deg); }
  50%  { transform: translateY(50vh)  rotate(360deg) rotateY(180deg); }
  100% { transform: translateY(105vh) rotate(720deg) rotateY(360deg); }
}
@keyframes sakura-sway {
  from { margin-left: -30px; }
  to   { margin-left:  30px; }
}

  line-height: 1;
}
.result-name {
  font-family: "Quicksand", "Noto Sans TC", sans-serif;
  font-weight: 900;
  font-size: clamp(34px, 5vw, 48px);
  letter-spacing: .02em;
  margin: 0 0 8px;
}
.result-score {
  font-family: "Caveat", cursive;
  font-size: 22px;
  color: var(--accent);
  margin-bottom: 28px;
  letter-spacing: .05em;
}
.result-desc {
  font-family: "Quicksand", "Noto Sans TC", sans-serif;
  font-size: 17px;
  line-height: 2;
  color: var(--ink-soft);
}
.result-desc p { margin: 0 0 16px; }
.result-desc p:last-child { margin: 0; }

/* 活動資訊 */
.event {
  margin-top: 40px;
  padding: 32px 28px;
  border: 1px dashed var(--line);
  border-radius: 22px;
  background: var(--surface-2);
  text-align: center;
}
.event .label {
  font-family: "Caveat", cursive;
  font-size: 22px;
  color: var(--accent-2);
  letter-spacing: .1em;
}
.event .club {
  font-family: "Quicksand", "Noto Sans TC", sans-serif;
  font-weight: 900;
  font-size: 24px;
  margin: 6px 0 22px;
  letter-spacing: .05em;
}
.event-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-top: 8px;
}
.event-grid .item .k {
  font-family: "Caveat", cursive;
  font-size: 16px;
  color: var(--muted);
  letter-spacing: .1em;
  margin-bottom: 4px;
}
.event-grid .item .v {
  font-family: "Quicksand", "Noto Sans TC", sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  line-height: 1.4;
}

.again {
  margin-top: 28px;
  text-align: center;
}

/* 寫入回饋 */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--bg);
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 13px;
  letter-spacing: .1em;
  font-family: "Quicksand", "Noto Sans TC", sans-serif;
  opacity: 0;
  transition: opacity .35s, transform .35s;
  z-index: 100;
  pointer-events: none;
  box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ----------------------------------------------------------
   5. RWD
   ---------------------------------------------------------- */
@media (max-width: 640px) {
  .topbar { padding: 12px 14px; }
  .brand .text { display: none; }
  .datetime { font-size: 11px; padding: 6px 12px; }
  .stage { padding: 100px 18px 60px; }
  .poem { font-size: 16px; padding-left: 16px; }
  .result-card { padding: 32px 22px; }
  .event-grid { grid-template-columns: 1fr; gap: 14px; }
  .theme-pill { display: none; }
}

/* 小燈塔的光暈 */
.lh-glow { animation: glow 3.5s ease-in-out infinite; transform-origin: center; }
@keyframes glow {
  0%,100% { opacity: .55; }
  50%     { opacity: 1; }
}

      paragraphs: [
        "你非常習慣獨立，甚至有點刻意與家庭保持距離。對你來說，「距離產生美感」是保護自己免於情緒消耗的策略。你看似自由，但內心深處可能偶爾會感到一絲無根的漂泊感。",
        "雖然暫時的逃離，是現階段能想到避免衝突最好的解法，但還沒有圓滿喔！要練習去接納自己的情緒，練習去了解自己的父母，你會發現內心會變得更加踏實與平靜。",
        "歡迎你來到社課，跟我們談談心，一起去擁抱曾經受傷的自己。",
      ],
    },
    cactus: {
      key: "cactus",
      emoji: "🌵",
      name: "孤島型",
      paragraphs: [
        "對你而言，原生家庭目前可能是一個壓力源大於避風港的地方。為了保護自己，你選擇拉開距離、減少接觸。你很勇敢地在為自己的生活奮鬥，但也可能常感到孤立無援。",
        "儘管家庭暫時無法提供溫暖，但可以相信自己是很有力量的，家裡的氛圍真的可以隨著我們的心而改變 ☺️ 現在的你，想必想要有個好好放鬆下來的環境吧！辛苦你了～",
        "歡迎你一起來到社課，跟我們談談心，回到小時候純真快樂的自己。",
      ],
    },
  };

  function classifyScore(score) {
    if (score >= 27) return TYPES.sunflower;
    if (score >= 22) return TYPES.tree;
    if (score >= 16)  return TYPES.duckweed;
    return TYPES.cactus;
  }

  /* ---------- 狀態 ---------- */
  const state = {
    name: "",
    answers: Array(QUESTIONS.length).fill(null), // 每題分數值（1~4）
    idx: 0,
  };

  /* ---------- 螢幕切換（不會碰到 audio） ---------- */
  function showScreen(name) {
    document.querySelectorAll(".screen").forEach(s => {
      s.classList.toggle("active", s.dataset.screen === name);
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- 渲染題目 ---------- */
  function renderProgress() {
    const wrap = document.getElementById("progress");
    wrap.innerHTML = "";
    for (let i = 0; i < QUESTIONS.length; i++) {
      const dot = document.createElement("span");
      if (i < state.idx) dot.classList.add("done");
      else if (i === state.idx) dot.classList.add("current");
      wrap.appendChild(dot);
    }
  }

  function renderQuestion() {
    const i = state.idx;
    const Q = QUESTIONS[i];
    document.getElementById("qNum").textContent =
      "Question " + String(i + 1).padStart(2, "0");
    document.getElementById("qText").textContent = Q.q;
    document.getElementById("stepInfo").textContent = `${i + 1} / ${QUESTIONS.length}`;

    const optsWrap = document.getElementById("qOptions");
    optsWrap.innerHTML = "";
    const labels = ["A", "B", "C", "D"];
    Q.opts.forEach((o, k) => {
      const btn = document.createElement("button");
      btn.className = "option" + (state.answers[i] === o.v ? " selected" : "");
      btn.innerHTML = `
        <span class="badge">${labels[k]}</span>
        <span class="text">${o.t}</span>
      `;
      btn.addEventListener("click", () => {
        state.answers[i] = o.v;
        renderQuestion();
        // 自動往下一題（更順暢的體驗），最後一題不自動
        if (i < QUESTIONS.length - 1) {
          setTimeout(() => { state.idx++; renderProgress(); renderQuestion(); }, 280);
        }
      });
      optsWrap.appendChild(btn);
    });

    // 按鈕狀態
    document.getElementById("prevBtn").disabled = i === 0;
    document.getElementById("prevBtn").style.opacity = i === 0 ? .35 : 1;

    const nextBtn = document.getElementById("nextBtn");
    if (i === QUESTIONS.length - 1) {
      nextBtn.innerHTML = `查看結果 <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    } else {
      nextBtn.innerHTML = `下一題 <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;
    }
    nextBtn.disabled = state.answers[i] === null;
    nextBtn.style.opacity = state.answers[i] === null ? .35 : 1;

    renderProgress();
  }

  function goNext() {
    if (state.answers[state.idx] === null) return;
    if (state.idx < QUESTIONS.length - 1) {
      state.idx++;
      renderQuestion();
    } else {
      finish();
    }
  }
  function goPrev() {
    if (state.idx === 0) return;
    state.idx--;
    renderQuestion();
  }

  /* ---------- 結算 ---------- */
  function finish() {
    const score = state.answers.reduce((a, b) => a + (b || 0), 0);
    const type = classifyScore(score);

    document.getElementById("rEmoji").textContent = type.emoji;
    document.getElementById("rName").textContent = type.name;
    document.getElementById("rScore").textContent = `${score} 分`;
    document.getElementById("rDesc").innerHTML = type.paragraphs.map(p => `<p>${p}</p>`).join("");

    showScreen("result");

    // 寫入 Firestore（若有設定）
    if (typeof window.__saveResponse === "function") {
      window.__saveResponse({
        name: state.name || "（匿名）",
        score,
        type: type.key,
        typeName: type.name,
        answers: state.answers.slice(),
      }).then(res => {
        if (res && res.ok) showToast("已雲端記錄 ☁︎");
      });
    }
  }

  function showToast(text) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  }

  /* ---------- 主題（白天 / 夜晚自動切換） ---------- */
  const themeBtn = document.getElementById("themeToggle");
  // mode: "auto" | "day" | "night"
  let themeMode = "auto";

  function applyTheme() {
    const hour = new Date().getHours();
    let theme = "day";
    if (themeMode === "auto") {
      // 18:00 ~ 隔日 06:00 為晚上
      theme = (hour >= 18 || hour < 6) ? "night" : "day";
    } else {
      theme = themeMode;
    }
    document.documentElement.dataset.theme = theme;
    const labelMap = { auto: "自動", day: "日", night: "夜" };
    if (themeMode === "auto") {
      themeBtn.textContent = `自動 · ${theme === "night" ? "夜" : "日"}`;
    } else {
      themeBtn.textContent = labelMap[themeMode];
    }
  }
  themeBtn.addEventListener("click", () => {
    themeMode = themeMode === "auto" ? "day"
              : themeMode === "day"  ? "night"
              : "auto";
    applyTheme();
  });

  /* ---------- 日期 / 星期 / 時間 ---------- */
  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  function tick() {
    const now = new Date();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    const w = WEEK[now.getDay()];
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    const dt = document.getElementById("datetime");
    dt.querySelector(".date").textContent = `${m} / ${d} （${w}）`;
    dt.querySelector(".time").textContent = `${hh}:${mm}`;
    applyTheme(); // 跨小時時自動切主題
  }
  tick();
  setInterval(tick, 30 * 1000);

  /* ---------- 音樂控制（永久不中斷的關鍵：絕對不重新建立 / load 此元素）---------- */
  const audio = document.getElementById("bgMusic");
  audio.volume = 0.55;

  const musicBtn = document.getElementById("musicBtn");
  const ICON_PLAY = `<div class="bars"><span></span><span></span><span></span><span></span></div>`;
  const ICON_MUTE = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5L6 9H2v6h4l5 4V5z"/>
      <line x1="23" y1="9" x2="17" y2="15"/>
      <line x1="17" y1="9" x2="23" y2="15"/>
    </svg>`;

  function setMusicUI(playing) {
    musicBtn.classList.toggle("playing", playing);
    musicBtn.innerHTML = playing ? ICON_PLAY : ICON_MUTE;
  }
  setMusicUI(false);

  async function tryPlay() {
    try {
      await audio.play();
      setMusicUI(true);
    } catch (err) {
      console.warn("自動播放被瀏覽器阻擋：", err);
      setMusicUI(false);
    }
  }
  function pauseMusic() {
    audio.pause();
    setMusicUI(false);
  }

  musicBtn.addEventListener("click", () => {
    if (audio.paused) tryPlay();
    else pauseMusic();
  });
  // audio 事件同步 UI
  audio.addEventListener("play",  () => setMusicUI(true));
  audio.addEventListener("pause", () => setMusicUI(false));

  /* ---------- 啟動 ---------- */
  document.getElementById("startBtn").addEventListener("click", async () => {
    state.name = (document.getElementById("userName").value || "").trim();
    state.idx = 0;
    state.answers = Array(QUESTIONS.length).fill(null);

    // 點擊「開始測驗」這個 user gesture 一併啟動音樂；
    // 但僅啟動，不會重新 load。之後切螢幕都不會打斷音訊串流。
    if (audio.paused) tryPlay();

    renderQuestion();
    showScreen("quiz");
  });

  document.getElementById("prevBtn").addEventListener("click", goPrev);
  document.getElementById("nextBtn").addEventListener("click", goNext);

  document.getElementById("restartBtn").addEventListener("click", () => {
    state.idx = 0;
    state.answers = Array(QUESTIONS.length).fill(null);
    document.getElementById("userName").value = "";
    showScreen("welcome");
    // 注意：不去動 audio，所以音樂繼續播。
  });

  /* ---------- 鍵盤快捷鍵：← / → ---------- */
  document.addEventListener("keydown", (e) => {
    const active = document.querySelector(".screen.active")?.dataset.screen;
    if (active !== "quiz") return;
    if (e.key === "ArrowRight") goNext();
    if (e.key === "ArrowLeft")  goPrev();
    if (["1","2","3","4"].includes(e.key)) {
      const k = parseInt(e.key, 10) - 1;
      const opts = QUESTIONS[state.idx].opts;
      if (opts[k]) {
        state.answers[state.idx] = opts[k].v;
        renderQuestion();
      }
    }
  });
</script>

</body>
</html>
